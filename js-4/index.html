<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Счетчик и Лото</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-block">
        <h2>Счетчик</h2>
        <div id="counter-value">0</div>
        
        <button id="btn-decrease">Уменьшить</button>
        <button id="btn-reset">Сбросить</button>
        <button id="btn-increase">Увеличить</button>
    </div>

    <div class="app-block">
        <h2>Лото</h2>
        <button id="btn-lotto">Сгенерировать числа</button>
        
        <div id="lotto-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

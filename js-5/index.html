<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашка</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Вход</h2>
            <form id="authForm">
                <input type="text" id="login" placeholder="Логин" required>
                <input type="password" id="password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>
            <div id="message"></div>
        </div>

        <div class="card">
            <h2>Подсчет суммы</h2>
            <input type="text" id="numbersInput" placeholder="Введите числа (напр: 2, 5, 6, 7)">
            <button type="button" id="calcBtn">Посчитать sumAll</button>
            <div id="sumResult"></div>
        </div>
    </div>

</body>
</html>
